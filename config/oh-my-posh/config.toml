version = 4
final_space = false

[transient_prompt]
foreground = "gray"
template = " "

[[blocks]]
type = "prompt"
alignment = "left"

    [[blocks.segments]]
    type = "session"
    style = "plain"
    foreground = "blue"
    template = "{{ .UserName }}@{{ .HostName }} "

    [[blocks.segments]]
    type = "shell"
    style = "plain"
    foreground = "magenta"
    template = "{{ .Name }} "

    [[blocks.segments]]
    type = "path"
    style = "plain"
    foreground = "cyan"
    template = "{{ .PWD }} "

    [[blocks.segments]]
    type = "git"
    style = "plain"
    foreground = "yellow"
    template = "{{ .HEAD }}"

[[blocks]]
type = "prompt"
alignment = "left"
newline = true

    [[blocks.segments]]
    type = "text"
    style = "plain"
    foreground = "green"
    template = "╰╴ " #❯
