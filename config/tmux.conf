# Prefix
set -g prefix M-q
unbind C-b

# Panes
# Nav
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Swapping
bind H swap-pane -s '{left-of}'
bind J swap-pane -s '{down-of}'
bind K swap-pane -s '{up-of}'
bind L swap-pane -s '{right-of}'

# Resizing
bind -r M-h resize-pane -L 5
bind -r M-j resize-pane -D 5
bind -r M-k resize-pane -U 5
bind -r M-l resize-pane -R 5

# Window splitting
bind y split-window -v
bind o split-window -h

# Close
bind w kill-pane

# Max-min-imize
bind e resize-pane -Z

# Windows
# Nav
bind u previous-window
bind i next-window

# Swapping
bind U swap-window -t -1
bind I swap-window -t +1

# Kill
bind q kill-window

# New
bind r new-window
