[general]
import = ["~/.config/alacritty/theme.toml",]

[window]
opacity = 0.9

[font]
size = 14

normal = { family = "MapleMonoNLNF", style = "Regular" }
bold = { family = "MapleMonoNLNF", style = "Bold" }
italic = { family = "MapleMonoNLNF", style = "Italic" }
bold_italic = { family = "MapleMonoNLNF", style = "Bold Italic" }

[cursor]
style = {shape = "Beam", blinking = "Always"}
blink_interval = 500
blink_timeout = 0
unfocused_hollow = false

[mouse]
hide_when_typing = true
