# Boring, my config is a fucking mess, don't worry, it's made by 99% of AI.
set -g default-terminal "screen-256color"
set -as terminal-features ",*"

unbind C-b
set-option -g prefix M-q
bind-key M-q send-prefix

set -g base-index 1

set -g status-right '#{?#{==:#{client_key_table},root},,MODE: #{client_key_table}}'



# Windows
bind-key u previous-window \; switch-client -T window-nav
bind-key i next-window \; switch-client -T window-nav

bind-key -T window-nav u previous-window \; switch-client -T window-nav
bind-key -T window-nav i next-window \; switch-client -T window-nav

bind-key -r y split-window -v
bind-key -r o split-window -h

bind-key p new-window
bind-key X kill-window



# Panes
bind-key x kill-pane

# Pane navigation mode
bind-key h select-pane -L \; switch-client -T pane-nav
bind-key j select-pane -D \; switch-client -T pane-nav
bind-key k select-pane -U \; switch-client -T pane-nav
bind-key l select-pane -R \; switch-client -T pane-nav

bind-key -T pane-nav h select-pane -L \; switch-client -T pane-nav
bind-key -T pane-nav j select-pane -D \; switch-client -T pane-nav
bind-key -T pane-nav k select-pane -U \; switch-client -T pane-nav
bind-key -T pane-nav l select-pane -R \; switch-client -T pane-nav

bind-key -T pane-nav Escape switch-client -T root
bind-key -T pane-nav Enter switch-client -T root

# Pane resizing mode
bind-key C-h resize-pane -L 5 \; switch-client -T pane-resize
bind-key C-j resize-pane -D 5 \; switch-client -T pane-resize
bind-key C-k resize-pane -U 5 \; switch-client -T pane-resize
bind-key C-l resize-pane -R 5 \; switch-client -T pane-resize

bind-key -T pane-resize h resize-pane -L 5 \; switch-client -T pane-resize
bind-key -T pane-resize j resize-pane -D 5 \; switch-client -T pane-resize
bind-key -T pane-resize k resize-pane -U 5 \; switch-client -T pane-resize
bind-key -T pane-resize l resize-pane -R 5 \; switch-client -T pane-resize

bind-key -T pane-resize Escape switch-client -T root
bind-key -T pane-resize Enter switch-client -T root

# Pane swapping mode
bind-key H swap-pane -U \; switch-client -T pane-swap
bind-key J swap-pane -D \; switch-client -T pane-swap
bind-key K swap-pane -U \; switch-client -T pane-swap
bind-key L swap-pane -D \; switch-client -T pane-swap

bind-key -T pane-swap h swap-pane -U \; switch-client -T pane-swap
bind-key -T pane-swap j swap-pane -D \; switch-client -T pane-swap
bind-key -T pane-swap k swap-pane -U \; switch-client -T pane-swap
bind-key -T pane-swap l swap-pane -D \; switch-client -T pane-swap

bind-key -T pane-swap Escape switch-client -T root
bind-key -T pane-swap Enter switch-client -T root
