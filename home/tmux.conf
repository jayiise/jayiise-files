set -g default-terminal "screen-256color"
set -as terminal-features ",*"

unbind C-b
set-option -g prefix M-q
bind-key M-q send-prefix

# Windows
bind-key u previous-window
bind-key i next-window

# Panes
bind-key y split-window -v
bind-key o split-window -h

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind-key -r M-h resize-pane -L 5
bind-key -r M-j resize-pane -D 5
bind-key -r M-k resize-pane -U 5
bind-key -r M-l resize-pane -R 5

bind-key H swap-pane -s '{left-of}' -t .
bind-key J swap-pane -s '{below}' -t .
bind-key K swap-pane -s '{above}' -t .
bind-key L swap-pane -s '{right-of}' -t .
